[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketagent"
version = "0.1.0"
description = "基于 PocketFlow 的编程 agent（类 Codex / Claude Code）"
readme = "README.md"
requires-python = ">=3.11"
# httpx 是 openai 本来就带的依赖，查余额时直接用
dependencies = ["openai>=1.40", "httpx"]

[project.optional-dependencies]
# Pillow 用来把大图缩小再发给模型，没有也能跑
web = ["aiohttp>=3.9", "pillow"]

[project.scripts]
pocketagent = "pocketagent.cli:main"

[tool.setuptools.packages.find]
include = ["pocketagent*", "pocketflow*"]

[tool.setuptools.package-data]
# 注意 static/* 不递归，js 和它的子目录要单独列（之前漏了，wheel 里没有 js，可编辑安装掩盖了这个问题）
"pocketagent.web" = ["static/*", "static/js/*", "static/js/*/*"]

[tool.ruff]
line-length = 120
