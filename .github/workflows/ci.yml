name: CI

on:
  push:
  pull_request:

# 同一分支 / 同一个 PR 又推了新提交，旧的那次就没必要跑完了
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # 一个平台挂了也要看到其他平台的结果，才知道是不是平台相关的问题
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # tests/mock/test_web_js.py 和 test_markdown_math.py 用 Node 直接 import 前端 ES 模块，没有 Node 会整组跳过
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 安装（含 web、tui 两组可选依赖，否则对应测试会跳过）
        run: python -m pip install -e ".[web,tui]"

      # 和 Makefile 的 test 目标一致；Windows 上不一定有 make，所以直接调 python。tests/live 会调真实接口，不在 CI 跑
      - name: mock 测试
        shell: bash
        run: python -m unittest discover -s tests/mock -t . 2>&1 | tee mock-test.log; exit ${PIPESTATUS[0]}

      # mock 挂了也跑，两套的结果都要看到
      - name: 上游 PocketFlow 测试
        if: success() || failure()
        shell: bash
        run: python -m unittest discover -s tests/vendor_pocketflow -t . 2>&1 | tee vendor-test.log; exit ${PIPESTATUS[0]}

      # DEBUG：临时把失败详情打成注解（不登录也能在运行页看到），调通后删掉
      - name: 失败详情
        if: failure()
        shell: bash
        run: |
          python - <<'PYEOF'
          import os, sys
          sys.stdout.reconfigure(encoding="utf-8")
          chunks = []
          for name in ("mock-test.log", "vendor-test.log"):
              if not os.path.exists(name):
                  continue
              text = open(name, encoding="utf-8", errors="replace").read()
              start = text.find("=" * 70)
              end = text.rfind("\nRan ")
              tail = text[end:end + 300] if end >= 0 else text[-6000:]
              body = text[start:end] if start >= 0 else ""
              full = f"[{name}]\n{tail}\n{body}"
              while full:
                  chunks.append(full[:3800])
                  full = full[3800:]
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for index, chunk in enumerate(chunks[:30]):
              level = ("error", "warning", "notice")[index // 10]
              print(f"::{level} title=part {index}::" + escape(chunk))
          PYEOF

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 固定版本：ruff 升级会改默认规则和规则细节，不固定的话哪天 CI 会无缘无故变红
      - name: 安装 ruff
        run: python -m pip install ruff==0.17.3

      # 只开现在已经干净的规则（pyflakes + 语法 / 语句级错误 + 没用到的循环变量）；
      # 格式化（ruff format）和其余风格规则不在 CI 里卡
      - name: ruff check
        run: ruff check --select F,E4,E7,E9,B007 .
